name: Build
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

env:
  # Pinned tool versions. Update the version and its sha256 together.
  HELM_VERSION: v3.22.1
  HELM_SHA256: 896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea # helm-v3.22.1-linux-amd64.tar.gz
  HELM_UNITTEST_VERSION: v1.2.1
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883 # kubeconform-linux-amd64.tar.gz

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Deps
      run: |
        mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/dl"
        cd "$RUNNER_TEMP/dl"

        curl -fsSLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
        echo "${HELM_SHA256}  helm-${HELM_VERSION}-linux-amd64.tar.gz" | sha256sum -c -
        tar -xzf "helm-${HELM_VERSION}-linux-amd64.tar.gz" linux-amd64/helm
        mv linux-amd64/helm "$RUNNER_TEMP/bin/helm"

        curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
        echo "${KUBECONFORM_SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
        tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
        mv kubeconform "$RUNNER_TEMP/bin/kubeconform"

        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        export PATH="$RUNNER_TEMP/bin:$PATH"

        helm plugin install https://github.com/helm-unittest/helm-unittest --version "${HELM_UNITTEST_VERSION}"

        helm version
        kubeconform -v
        helm plugin list

    - name: Check out
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1

    - name: Test
      run: |
        make lint
        make kubeconform
        make test
